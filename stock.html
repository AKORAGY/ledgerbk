<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E10600">
<title>Stock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar"><a href="dashboard.html">Dashboard</a><a href="transactions.html">Transactions</a><a href="debts.html">Debts</a><a href="stock.html" class="active">Stock</a></div>
<div class="container">
  <div class="left"><div class="card"><b>Remain stock</b>
  <table><tr><th>Item</th><th>Qty</th><th>Action</th></tr>
  <tbody id="stockList"></tbody>
  </table></div></div>
  <div class="right">
    <h4>Enter Items</h4>
    Item (existing) <select id="sItemSelect"><option value="">-- Select existing --</option></select>
    Or type new item <input id="sItemName" placeholder="e.g Sugar, Soap">
    Qty <input id="sQty" type="number" placeholder="0">
    Unit cost <input id="sCost" type="number" placeholder="0">
    <button onclick="updateStock()">Update</button>
  </div>
</div>
<script src="app.js"></script>
<script>
// Run after app.js loads
document.addEventListener('DOMContentLoaded', ()=>{
  if(typeof renderStock === 'function') renderStock();
  else if(typeof loadStock === 'function') loadStock();
  else {
    // fallback if app.js is missing function - render directly
    const stock = JSON.parse(localStorage.getItem('duka_stock')||'[]');
    const list = document.getElementById('stockList');
    if(stock.length===0){ list.innerHTML='<tr><td colspan=3>No stock yet</td></tr>'; return; }
    list.innerHTML = stock.map((s,i)=>`<tr><td>${s.name}</td><td>${s.qty}</td><td><button onclick="deleteStock(${i})">Del</button></td></tr>`).join('');
    // fill select
    const sel = document.getElementById('sItemSelect');
    sel.innerHTML = '<option value="">-- Select existing --</option>' + stock.map(s=>`<option>${s.name}</option>`).join('');
  }
});
</script>
</body>
</html>
