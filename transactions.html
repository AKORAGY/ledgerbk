<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E10600">
<title>Transactions</title>
<link rel="stylesheet" href="style.css">

<style>
.transaction-filters{
  background:#fff;
  color:#0A1931;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.transaction-filters .row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.transaction-filters input,
.transaction-filters select{
  flex:1;
  min-width:150px;
}

.transaction-table{
  overflow-x:auto;
}

tr.debt-row td{
  background:#ffe5e7 !important;
  color:#c40000 !important;
  font-weight:bold;
}

tr.payment-row td{
  background:#d4edda !important;
  color:#155724 !important;
  font-weight:bold;
}

tr.cash-row td{
  background:#fff !important;
  color:#333 !important;
}

.type-badge{
  padding:4px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.type-cash{
  background:#eee;
  color:#333;
}

.type-debt{
  background:#E10600;
  color:white;
}

.type-payment{
  background:green;
  color:white;
}

@media(max-width:700px){
  .transaction-filters .row{
    flex-direction:column;
  }

  .transaction-filters input,
  .transaction-filters select{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="navbar">
<a href="dashboard.html">Dashboard</a>
<a href="transactions.html" class="active">Transactions</a>
<a href="debts.html">Debts</a>
<a href="orgs.html">Orgs</a>
<a href="stock.html">Stock</a>
</div>

<div class="container" style="flex-direction:column">

<div class="transaction-filters">

<h4>🔎 Transaction Filter</h4>

<div class="row">

<input
id="transactionNameFilter"
placeholder="Search name..."
oninput="filterTransactions()"
>

<select id="transactionDateFilter" onchange="filterTransactions()">
<option value="all">All</option>
<option value="today">Today</option>
<option value="yesterday">Yesterday</option>
<option value="custom">Custom Date</option>
</select>

<input
id="transactionCustomDate"
type="date"
style="display:none"
onchange="filterTransactions()"
>

</div>

</div>

<div class="card">

<h4>All Transactions</h4>

<div class="transaction-table">

<table>

<thead>
<tr>
<th>Name</th>
<th>Item</th>
<th>Qty</th>
<th>Unit</th>
<th>Amount</th>
<th>Type</th>
<th>Date</th>
</tr>
</thead>

<tbody id="transList">
<tr>
<td colspan="7" class="loading">Loading...</td>
</tr>
</tbody>

</table>

</div>

</div>

</div>

<script src="app.js"></script>

<script>
document.getElementById('transactionDateFilter').addEventListener('change', function(){

    document.getElementById('transactionCustomDate').style.display =
        this.value === 'custom' ? 'block' : 'none';

    filterTransactions();

});
</script>

</body>
</html>
