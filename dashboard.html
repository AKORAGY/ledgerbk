<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E10600">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css"></head><body>
<div class="navbar"><a href="dashboard.html" class="active">Dashboard</a><a href="transactions.html">Transactions</a><a href="debts.html">Debts</a><a href="stock.html">Stock</a></div>
<div class="container">
  <div class="left">
    <div class="card">No. transactions <b id="tCount">0</b> <select id="filterDate"><option>Today</option><option>All</option></select></div>
    <div class="card">Today amount <b id="tAmount">UGX 0</b></div>
    <div class="card notice"><b>Notices</b><div id="notices">Loading...</div></div>
  </div>
  <div class="right">
    <h4>Enter transaction</h4>
    Item <select id="item"></select>
    Qty <input id="qty" type="number">
    Customer (if debit) <input id="debtorName" placeholder="Name if debit">
    <div style="display:flex;gap:5px"><button onclick="enterTransaction('cash')">Cash</button><button class="red" onclick="enterTransaction('debit')">Debit</button></div>
  </div>
</div>
<script src="app.js"></script>
</body></html>
